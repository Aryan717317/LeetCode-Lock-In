<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔒 LeetCode Lock-In</title>
  <link rel="stylesheet" href="lock.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="lock-icon" id="lockIcon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="title">LeetCode Lock-In</h1>
      <p class="subtitle" id="subtitle">Solve problems to unlock your browsing</p>
    </div>

    <!-- Blocked URL Info -->
    <div class="blocked-info" id="blockedInfo">
      <span class="blocked-label">Blocked:</span>
      <span class="blocked-url" id="blockedUrl">loading...</span>
    </div>

    <!-- Progress Section -->
    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-label">Progress</span>
        <span class="progress-count" id="progressCount">0/0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-glow" id="progressGlow"></div>
      </div>
      <div class="progress-steps" id="progressSteps"></div>
    </div>

    <!-- Current Problem Card -->
    <div class="problem-card" id="problemCard">
      <div class="problem-card-header">
        <span class="problem-number" id="problemNumber">Problem #1</span>
        <span class="difficulty-badge" id="difficultyBadge">Easy</span>
      </div>
      <h2 class="problem-title" id="problemTitle">Loading...</h2>
      <div class="problem-category" id="problemCategory"></div>
      <a class="solve-button" id="solveButton" href="#" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Go to Problem
      </a>
    </div>

    <!-- Problem Queue -->
    <div class="queue-section" id="queueSection">
      <h3 class="queue-title">Problem Queue</h3>
      <div class="queue-list" id="queueList"></div>
    </div>

    <!-- Motivational Quote -->
    <div class="quote-section">
      <p class="quote" id="quote">"The only way to learn programming is by writing programs."</p>
      <p class="quote-author" id="quoteAuthor">— Dennis Ritchie</p>
    </div>
  </div>

  <script src="lock.js"></script>
</body>
</html>
